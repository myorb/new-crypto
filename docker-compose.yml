services:
  postgres:
    image: postgres:18
    container_name: templ-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-templ_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep the cluster under /var/lib/postgresql/18/docker,
      # so the volume mounts the parent (not the old /var/lib/postgresql/data).
      - postgres_data:/var/lib/postgresql
      # sqlc schema is applied once, when the volume is first created.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-templ_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
