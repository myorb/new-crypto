version: "3"

vars:
  # The app port: an explicit 'task dev PORT=8091' wins, otherwise the next
  # free port from 8090 up. The templ proxy and the app share the result,
  # so hot reload never points at a foreign app.
  FREE_PORT:
    sh: port=8090; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PORT: '{{.PORT | default .FREE_PORT}}'

  # Tailwind standalone CLI release downloaded when tailwindcss is not on PATH
  # (Render's build image has no Homebrew). Keep in step with the local install.
  TAILWIND_VERSION: v4.3.3
  TAILWIND_TARGET:
    sh: |
      case "$(uname -s)-$(uname -m)" in
        Linux-x86_64)  echo linux-x64 ;;
        Linux-aarch64) echo linux-arm64 ;;
        Darwin-arm64)  echo macos-arm64 ;;
        Darwin-x86_64) echo macos-x64 ;;
        *) echo "no Tailwind CLI build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
      esac
  # tailwindcss from PATH when installed, otherwise the copy tailwind:install puts in ./bin.
  TAILWIND:
    sh: command -v tailwindcss || echo ./bin/tailwindcss

  # Postgres superuser + database, for the Docker-side admin tasks only.
  PG_USER: '{{.POSTGRES_USER | default "postgres"}}'
  PG_DB: '{{.POSTGRES_DB | default "templ_app"}}'

dotenv: [".env"]

tasks:
  # ---------------------------------------------------------------------------
  # Database (see db/README.md)
  # ---------------------------------------------------------------------------
  db:
    desc: Start Postgres 18 in Docker and apply pending migrations
    cmds:
      - task: db:up
      - task: db:migrate

  db:up:
    desc: Start Postgres and wait until it accepts connections (roles are created on first start)
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop Postgres (data is kept in the postgres_data volume)
    cmds:
      - docker compose down

  db:reset:
    desc: Stop Postgres and drop its data. Next `task db` recreates roles and re-applies all migrations
    cmds:
      - docker compose down -v

  db:migrate:
    desc: Apply all pending migrations (as templ_app_migrator, via MIGRATE_DATABASE_URL)
    cmds:
      - go run ./cmd/migrate up

  db:status:
    desc: Show which migrations are applied
    cmds:
      - go run ./cmd/migrate status

  db:rollback:
    desc: Roll back the most recent migration
    cmds:
      - go run ./cmd/migrate down

  db:new:
    desc: "Create an empty migration: task db:new NAME=add_kyc_documents"
    requires:
      vars: [NAME]
    cmds:
      - go run ./cmd/migrate create {{.NAME}}

  db:psql:
    desc: Open psql inside the Postgres container as the superuser
    interactive: true
    cmds:
      - docker compose exec postgres psql -U {{.PG_USER}} -d {{.PG_DB}}

  db:grants:
    desc: Show what the runtime role (templ_app) may do on each table
    cmds:
      - |
        docker compose exec -T postgres psql -U {{.PG_USER}} -d {{.PG_DB}} <<'SQL'
        \echo --- table privileges of templ_app ---
        SELECT c.relname AS table,
               coalesce(string_agg(p.priv, ', ' ORDER BY p.priv) FILTER (WHERE has_table_privilege('templ_app', c.oid, p.priv)), '(none)') AS privileges
        FROM pg_class c
        CROSS JOIN (VALUES ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE'), ('TRUNCATE')) AS p(priv)
        WHERE c.relnamespace = 'public'::regnamespace AND c.relkind IN ('r', 'v')
        GROUP BY c.relname ORDER BY c.relname;
        \echo --- column-level privileges of templ_app ---
        SELECT table_name, privilege_type, string_agg(column_name, ', ' ORDER BY column_name) AS columns
        FROM information_schema.role_column_grants
        WHERE grantee = 'templ_app' AND table_schema = 'public'
        GROUP BY table_name, privilege_type ORDER BY table_name;
        SQL

  sqlc:
    desc: Regenerate internal/store from db/migrations + db/queries
    cmds:
      - sqlc generate

  # ---------------------------------------------------------------------------
  # App
  # ---------------------------------------------------------------------------
  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - templ generate --watch --proxy="http://localhost:{{.PORT}}" --cmd="go run ./main.go" --open-browser=false
    env:
      PORT: "{{.PORT}}"

  tailwind:
    desc: Watch Tailwind CSS changes
    deps: [tailwind:install]
    cmds:
      - "{{.TAILWIND}} -i ./assets/css/globals.css -o ./assets/css/output.css --watch"

  tailwind:install:
    desc: Download the Tailwind standalone CLI into ./bin (skipped when tailwindcss is already on PATH)
    status:
      - command -v tailwindcss || test -x ./bin/tailwindcss
    cmds:
      - mkdir -p bin
      - curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/tailwindcss-{{.TAILWIND_TARGET}} -o bin/tailwindcss
      - chmod +x bin/tailwindcss

  css:
    desc: Build the minified production stylesheet at assets/css/output.css
    deps: [tailwind:install]
    cmds:
      - "{{.TAILWIND}} -i ./assets/css/globals.css -o ./assets/css/output.css --minify"

  build:
    desc: Production build (what Render runs) - the stylesheet plus the ./app binary. Does not run templ generate; the *_templ.go files are committed.
    cmds:
      - task: css
      - go build -o app .

  dev:
    desc: Start development server with hot reload
    cmds:
      - task --parallel tailwind templ
